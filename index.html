<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Codify Food Court</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <!-- logo -->
        <div class="nav-logo">
            <img class="nav-logo-img" src="logo.png">
            <a>Codify</a>
        </div>
        <!-- nav links -->
        <div class="nav-links">
            <a class="nav-links-a-home">Home</a>
            <a>Menu</a>
            <a>About us</a>
            <a>Reservation</a>
            <a>Blog</a>
        </div>
        <!-- buttons -->
        <div class="nav-buttons">
            <button class="icon-button"><img src="user.png" class="icon-img"></button>
            <button class="icon-button"><img src="search.png" class="icon-img"></button>
            <button class="icon-button-bag"><img src="icons8-shopping-bag-48.png" class="icon-img-bag"></button>
        </div>
    </header>
    <div class="main-content">
        <!--the page interface  -->
        <div class="left-section">
            <div class="welcome">
                <hr class="line">
                <p>WELCOME TO OUR RESTAURANT</p>
            </div>
            <h1>Enjoy healthy and<br>delicious food.</h1>
            <div class="left-buttons">
                <button class="ord-button">order now</button>
                <button class="res-button">Reservation</button>
            </div>
                <!-- schedule main -->
            <div class="schedule">
                <p class="schedule-title">WE ARE OPEN FROM</p>
                <p><a class="schedule-title-text">Mon-Sat:</a> 09:00am-02:00pm</p>
                <p><a class="schedule-title-text">Sunday:</a> 04:00pm-08:00pm</p>
            </div>
        </div>
        <!-- the rigth section -->
        <div class="right-section">
            <div class="right-section-img">
                <img src="burger-removebg-preview.png">
            </div>
            <div class="socials">
                <a>FACEBOOK</a>
                <a>WHATSAPP</a>
                <a>INSTAGRAM</a>
            </div>
        </div>
    </div>
</body>

</html>
